name: Build stable Mythchain releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Test Go packages
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build stable cross-platform archives and Ubuntu packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT_DIR="release/${GITHUB_REF_NAME}"
          VERSION="$VERSION" OUT_DIR="$OUT_DIR" COMMIT="$GITHUB_SHA" bash build_validator_release.sh

      - name: Publish stable release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mythchain ${{ github.ref_name }}
          prerelease: false
          draft: false
          files: release/${{ github.ref_name }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
