name: Build Mythchain validator packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test Go packages
        run: go test ./...

      - name: Build Linux amd64/arm64 tarballs and Ubuntu packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT_DIR="release/${GITHUB_REF_NAME}"
          VERSION="$VERSION" OUT_DIR="$OUT_DIR" bash build_validator_release.sh

      - name: Publish prerelease assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mythchain validator packages ${{ github.ref_name }}
          prerelease: true
          files: release/${{ github.ref_name }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
